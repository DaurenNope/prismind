<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Prismind Dashboard{% endblock %}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            line-height: 1.6;
        }
        .navbar {
            background: #1a1a1a;
            border-bottom: 2px solid #2a2a2a;
            padding: 0;
        }
        .nav-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 30px;
            padding: 0 20px;
        }
        .brand {
            font-size: 20px;
            font-weight: 700;
            padding: 20px 0;
            color: #4a9eff;
            text-decoration: none;
        }
        .nav-links {
            display: flex;
            gap: 0;
            flex: 1;
        }
        .nav-link {
            padding: 20px 20px;
            color: #888;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .nav-link:hover {
            color: #e0e0e0;
            background: #1f1f1f;
        }
        .nav-link.active {
            color: #4a9eff;
            border-bottom-color: #4a9eff;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        .page-header {
            margin-bottom: 30px;
        }
        .page-title {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .page-subtitle {
            color: #888;
            font-size: 15px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #2a2a2a;
        }
        .stat-label {
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: #fff;
        }
        .btn {
            padding: 10px 20px;
            background: #4a9eff;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover {
            background: #3a8eef;
            transform: translateY(-1px);
        }
        .btn-secondary {
            background: #2a2a2a;
            color: #e0e0e0;
        }
        .btn-secondary:hover {
            background: #3a3a3a;
        }
        .btn-danger {
            background: #ef4444;
        }
        .btn-danger:hover {
            background: #dc2626;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <a href="/" class="brand">🎯 Prismind</a>
            <div class="nav-links">
                <a href="/" class="nav-link {% if page == 'dashboard' %}active{% endif %}">Dashboard</a>
                <a href="/review" class="nav-link {% if page == 'review' %}active{% endif %}">Review Posts</a>
                <a href="/scheduled" class="nav-link {% if page == 'scheduled' %}active{% endif %}">Scheduled</a>
                <a href="/trends" class="nav-link {% if page == 'trends' %}active{% endif %}">Trends</a>
            </div>
        </div>
    </nav>

    {% block content %}{% endblock %}

    {% block extra_js %}{% endblock %}
</body>
</html>
