name: 🌐 Social Media Collector

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours

jobs:
  collect-social:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - uses: actions/checkout@v4
    
    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install python-dotenv requests openai
    
    - name: 🚀 Run Collection & Analysis
      id: collector
      env:
        # Reddit
        REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
        REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
        REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
        
        # Twitter
        TWITTER_EMAIL: ${{ secrets.TWITTER_EMAIL }}
        TWITTER_USERNAME: ${{ secrets.TWITTER_USERNAME }}
        TWITTER_PASSWORD: ${{ secrets.TWITTER_PASSWORD }}
        
        # OpenAI for analysis
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        
        # GitHub context
        GITHUB_SERVER_URL: ${{ github.server_url }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        
      run: |
        # Make the script executable
        chmod +x ./scripts/run_collector.py
        
        # Run the collector script
        python ./scripts/run_collector.py
        
        # Capture the output for the next step
        TELEGRAM_MESSAGE=$(grep -oP '::set-output name=telegram_message::\K.*' < <(tail -1))
        echo "telegram_message=$TELEGRAM_MESSAGE" >> $GITHUB_OUTPUT

    - name: 📤 Upload results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: collection-results
        path: |
          collection.log
          collection_results.json
    
    - name: 📱 Send Telegram notification
      if: always()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: ${{ steps.collector.outputs.telegram_message }}
        parse_mode: markdown
    
    - name: 🚨 Notify on failure
      if: failure()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |
          ❌ *Social Media Collection Failed*
          
          The collection job has failed. Please check the logs for details.
          
          [View Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
        parse_mode: markdown
