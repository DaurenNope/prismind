name: CI

on:
  push:
    branches: [ main, cleanup/**, feat/** ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Lint (flake8 if available)
        run: |
          if python -c "import importlib; importlib.import_module('flake8')" 2>/dev/null; then flake8 . || true; fi
      - name: Run tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          ruff --version
          ruff check .
      - name: Type check (mypy)
        run: |
          mypy src || true
      - name: Tests
        run: |
          pytest -q


