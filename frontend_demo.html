<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beyondlines Persona Studio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .examples-section {
            margin-bottom: 20px;
        }

        .example-input {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .example-input input {
            flex: 1;
        }

        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #5a67d8;
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #48bb78;
        }

        .btn-secondary:hover {
            background: #38a169;
        }

        .btn-danger {
            background: #f56565;
        }

        .btn-danger:hover {
            background: #e53e3e;
        }

        .results-section {
            margin-top: 20px;
        }

        .persona-card {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .persona-card h3 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 15px;
        }

        .metric {
            text-align: center;
            padding: 10px;
            background: white;
            border-radius: 6px;
        }

        .metric-value {
            font-size: 1.5em;
            font-weight: bold;
            color: #667eea;
        }

        .metric-label {
            font-size: 0.9em;
            color: #666;
            margin-top: 5px;
        }

        .generated-content {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }

        .quality-score {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding: 10px;
            background: white;
            border-radius: 6px;
        }

        .score-bar {
            flex: 1;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin: 0 15px;
            overflow: hidden;
        }

        .score-fill {
            height: 100%;
            background: linear-gradient(90deg, #f56565, #48bb78, #667eea);
            transition: width 0.3s;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .error {
            background: #fed7d7;
            color: #c53030;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .success {
            background: #c6f6d5;
            color: #22543d;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .platform-chips {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .chip {
            background: #e0e7ff;
            color: #667eea;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .metrics {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎭 Beyondlines Persona Studio</h1>
            <p>Create AI personas from examples and generate authentic content</p>
        </div>

        <div class="main-content">
            <!-- Persona Creation Panel -->
            <div class="card">
                <h2>Create New Persona</h2>

                <form id="personaForm">
                    <div class="form-group">
                        <label for="personaName">Persona Name</label>
                        <input type="text" id="personaName" placeholder="e.g., Tech Expert Alex" required>
                    </div>

                    <div class="form-group">
                        <label for="personaHandle">Handle</label>
                        <input type="text" id="personaHandle" placeholder="@techalex" required>
                    </div>

                    <div class="form-group">
                        <label for="personaDescription">Description</label>
                        <input type="text" id="personaDescription" placeholder="Tech expert sharing honest AI tool reviews" required>
                    </div>

                    <div class="form-group">
                        <label>Platforms</label>
                        <div class="platform-chips">
                            <label><input type="checkbox" name="platforms" value="twitter" checked> Twitter</label>
                            <label><input type="checkbox" name="platforms" value="linkedin"> LinkedIn</label>
                            <label><input type="checkbox" name="platforms" value="threads"> Threads</label>
                            <label><input type="checkbox" name="platforms" value="telegram"> Telegram</label>
                        </div>
                    </div>

                    <div class="examples-section">
                        <label>Example Posts (min. 3 recommended)</label>
                        <div id="examplesContainer">
                            <div class="example-input">
                                <input type="text" class="example-text" placeholder="Enter an example post...">
                                <button type="button" class="btn btn-secondary" onclick="addExample()">Add</button>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn">Create Persona</button>
                </form>
            </div>

            <!-- Content Generation Panel -->
            <div class="card">
                <h2>Generate Content</h2>

                <div id="personaSelect" class="form-group" style="display: none;">
                    <label for="selectedPersona">Select Persona</label>
                    <select id="selectedPersona">
                        <option value="">Create a persona first...</option>
                    </select>
                </div>

                <div id="contentGeneration" style="display: none;">
                    <div class="form-group">
                        <label for="topic">Topic/Content</label>
                        <textarea id="topic" placeholder="What do you want to post about? E.g., 'New AI startup raised $50M for autonomous coding agent'"></textarea>
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category">
                            <option value="general">General</option>
                            <option value="tech_analysis">Tech Analysis</option>
                            <option value="business">Business</option>
                            <option value="personal">Personal</option>
                            <option value="opinion">Opinion</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="platform">Platform</label>
                        <select id="platform">
                            <option value="twitter">Twitter</option>
                            <option value="linkedin">LinkedIn</option>
                            <option value="threads">Threads</option>
                            <option value="telegram">Telegram</option>
                        </select>
                    </div>

                    <button type="button" class="btn" onclick="generateContent()">Generate Content</button>
                </div>

                <div id="generationResults" class="results-section"></div>
            </div>
        </div>

        <!-- Existing Personas Display -->
        <div class="card">
            <h2>My Personas</h2>
            <div id="personasList">
                <p>Create your first persona to see it here...</p>
            </div>
        </div>
    </div>

    <script>
        // API Configuration
        const API_BASE = 'http://localhost:8001/api';

        // State management
        let personas = [];
        let examples = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadPersonas();
        });

        // Form submission
        document.getElementById('personaForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            await createPersona();
        });

        // Add example input
        function addExample() {
            const container = document.getElementById('examplesContainer');
            const exampleDiv = document.createElement('div');
            exampleDiv.className = 'example-input';
            exampleDiv.innerHTML = `
                <input type="text" class="example-text" placeholder="Enter an example post...">
                <button type="button" class="btn btn-secondary" onclick="this.parentElement.remove()">Remove</button>
            `;
            container.appendChild(exampleDiv);
        }

        // Create persona
        async function createPersona() {
            const name = document.getElementById('personaName').value;
            const handle = document.getElementById('personaHandle').value;
            const description = document.getElementById('personaDescription').value;

            // Get examples
            const exampleInputs = document.querySelectorAll('.example-text');
            const exampleTexts = Array.from(exampleInputs)
                .map(input => input.value.trim())
                .filter(text => text.length > 0);

            if (exampleTexts.length < 3) {
                showError('Please provide at least 3 example posts');
                return;
            }

            // Get selected platforms
            const platformCheckboxes = document.querySelectorAll('input[name="platforms"]:checked');
            const platforms = Array.from(platformCheckboxes).map(cb => cb.value);

            const personaData = {
                name,
                handle,
                description,
                platforms: platforms.length > 0 ? platforms : ['twitter'],
                examples: exampleTexts
            };

            try {
                showLoading('Creating persona...');

                const response = await fetch(`${API_BASE}/personas/create`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(personaData)
                });

                const result = await response.json();

                if (response.ok) {
                    showSuccess(`Persona "${result.name}" created successfully!`);
                    document.getElementById('personaForm').reset();
                    document.getElementById('examplesContainer').innerHTML = `
                        <div class="example-input">
                            <input type="text" class="example-text" placeholder="Enter an example post...">
                            <button type="button" class="btn btn-secondary" onclick="addExample()">Add</button>
                        </div>
                    `;
                    loadPersonas();
                } else {
                    showError(`Failed to create persona: ${result.detail}`);
                }
            } catch (error) {
                showError(`Error: ${error.message}`);
            }
        }

        // Load personas
        async function loadPersonas() {
            try {
                const response = await fetch(`${API_BASE}/personas/list`);
                const personasList = await response.json();

                personas = personasList;
                displayPersonas();
                updatePersonaSelect();

                if (personas.length > 0) {
                    document.getElementById('personaSelect').style.display = 'block';
                    document.getElementById('contentGeneration').style.display = 'block';
                }
            } catch (error) {
                console.error('Failed to load personas:', error);
            }
        }

        // Display personas
        function displayPersonas() {
            const container = document.getElementById('personasList');

            if (personas.length === 0) {
                container.innerHTML = '<p>Create your first persona to see it here...</p>';
                return;
            }

            container.innerHTML = personas.map(persona => `
                <div class="persona-card">
                    <h3>${persona.name} ${persona.handle}</h3>
                    <p>${persona.description}</p>
                    <div class="platform-chips">
                        ${persona.platforms.map(p => `<span class="chip">${p}</span>`).join('')}
                    </div>
                    <div class="metrics">
                        <div class="metric">
                            <div class="metric-value">${(persona.quality_metrics.voice_consistency * 100).toFixed(0)}%</div>
                            <div class="metric-label">Voice Consistency</div>
                        </div>
                        <div class="metric">
                            <div class="metric-value">${(persona.quality_metrics.authenticity_prediction * 100).toFixed(0)}%</div>
                            <div class="metric-label">Authenticity</div>
                        </div>
                        <div class="metric">
                            <div class="metric-value">${(persona.quality_metrics.engagement_potential * 100).toFixed(0)}%</div>
                            <div class="metric-label">Engagement</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Update persona select dropdown
        function updatePersonaSelect() {
            const select = document.getElementById('selectedPersona');
            select.innerHTML = '<option value="">Select a persona...</option>' +
                personas.map(p => `<option value="${p.id}">${p.name} (${p.handle})</option>`).join('');
        }

        // Generate content
        async function generateContent() {
            const personaId = document.getElementById('selectedPersona').value;
            const topic = document.getElementById('topic').value;
            const category = document.getElementById('category').value;
            const platform = document.getElementById('platform').value;

            if (!personaId) {
                showError('Please select a persona');
                return;
            }

            if (!topic.trim()) {
                showError('Please enter a topic');
                return;
            }

            const requestData = {
                persona_id: personaId,
                topic: topic,
                category: category,
                platform: platform
            };

            try {
                showLoading('Generating content...');

                const response = await fetch(`${API_BASE}/personas/${personaId}/generate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestData)
                });

                const result = await response.json();

                if (result.success) {
                    showGenerationResult(result);
                } else {
                    showError(`Generation failed: ${result.error}`);
                }
            } catch (error) {
                showError(`Error: ${error.message}`);
            }
        }

        // Show generation result
        function showGenerationResult(result) {
            const container = document.getElementById('generationResults');

            const scorePercentage = (result.quality_score || 0) * 100;
            const scoreColor = scorePercentage > 80 ? '#48bb78' : scorePercentage > 60 ? '#ecc94b' : '#f56565';

            container.innerHTML = `
                <div class="generated-content">
                    <h3>Generated Content</h3>
                    <p><strong>Platform:</strong> ${result.platform.charAt(0).toUpperCase() + result.platform.slice(1)}</p>
                    <p><strong>Persona:</strong> ${result.persona_name}</p>
                    <div style="background: white; padding: 15px; border-radius: 8px; margin: 15px 0;">
                        ${result.content}
                    </div>
                    <div class="quality-score">
                        <span>Quality Score:</span>
                        <div class="score-bar">
                            <div class="score-fill" style="width: ${scorePercentage}%; background: ${scoreColor};"></div>
                        </div>
                        <strong>${scorePercentage.toFixed(0)}%</strong>
                    </div>
                    <div style="margin-top: 10px; font-size: 0.9em; color: #666;">
                        Length: ${result.length} characters | Generated: ${new Date(result.generated_at).toLocaleString()}
                    </div>
                </div>
            `;
        }

        // Utility functions
        function showLoading(message) {
            const container = document.getElementById('generationResults');
            container.innerHTML = `<div class="loading">${message}...</div>`;
        }

        function showError(message) {
            const container = document.getElementById('generationResults');
            container.innerHTML = `<div class="error">❌ ${message}</div>`;
        }

        function showSuccess(message) {
            const container = document.getElementById('generationResults');
            container.innerHTML = `<div class="success">✅ ${message}</div>`;
        }
    </script>
</body>
</html>
