[pytest]
asyncio_mode = auto
# Default: run unit tests only (fast, no external dependencies)
addopts = -q -m "not integration and not e2e" -k "not threads_extractor and not threads_url and not twitter_extractor"
markers =
    integration: marks tests as integration tests (requires database/external services)
    e2e: marks tests as end-to-end tests (requires full system running)
    unit: marks tests as unit tests (fast, isolated)
    slow: marks tests as slow (deselect with '-m "not slow"')
    performance: marks tests as performance benchmarks
testpaths = tests
norecursedirs = mimesis archive

# Coverage configuration is in pyproject.toml
# Run with: pytest --cov=src --cov-report=html --cov-report=term-missing
