services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - redis
      - ollama
    ports:
      - "8080:8080"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    ports:
      - "8000:8000"

  worker-publisher:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      WORKER_QUEUE: publisher
    depends_on:
      - redis

  worker-rewriter:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis:6379/0
      WORKER_QUEUE: rewriter
    depends_on:
      - redis

  worker-collector-threads:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      WORKER_QUEUE: collector_threads
    depends_on:
      - redis

  worker-collector-twitter:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      WORKER_QUEUE: collector_twitter
    depends_on:
      - redis

  # Streamlit service removed - using Svelte frontend instead

volumes:
  ollama_data:
  redis_data:
