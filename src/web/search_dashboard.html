<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrisMind Research Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .search-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .search-form {
            display: grid;
            gap: 20px;
        }

        .search-input-group {
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 15px 50px 15px 20px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-btn {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .search-btn:hover {
            background: #5a6fd8;
        }

        .filters-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-label {
            font-weight: 600;
            margin-bottom: 5px;
            color: #555;
        }

        .filter-select, .filter-input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }

        .search-options {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-group input[type="checkbox"] {
            width: 18px;
            height: 18px;
        }

        .strategy-select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
        }

        .results-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .results-count {
            font-size: 1.1rem;
            color: #666;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-item {
            border: 1px solid #e1e5e9;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            background: #fafafa;
        }

        .result-item:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .result-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
            line-height: 1.4;
        }

        .result-meta {
            display: flex;
            gap: 15px;
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 10px;
        }

        .result-platform {
            background: #667eea;
            color: white;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .result-score {
            background: #28a745;
            color: white;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .result-content {
            color: #555;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .result-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tag {
            background: #f8f9fa;
            color: #495057;
            padding: 4px 8px;
            border-radius: 15px;
            font-size: 0.8rem;
            border: 1px solid #dee2e6;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }

        .stats-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 0.9rem;
        }

        .research-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .research-form {
            display: grid;
            gap: 15px;
        }

        .research-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
        }

        .research-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .research-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .research-btn:hover {
            background: #218838;
        }

        .research-report {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            border-left: 4px solid #28a745;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .search-section, .results-section, .research-section {
                padding: 20px;
            }
            
            .filters-section {
                grid-template-columns: 1fr;
            }
            
            .search-options {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 PrisMind Research Dashboard</h1>
            <p>Advanced content search and research powered by AI</p>
        </div>

        <!-- Statistics Section -->
        <div class="stats-section" id="statsSection">
            <div class="stat-card">
                <div class="stat-number" id="totalPosts">-</div>
                <div class="stat-label">Total Posts</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalPlatforms">-</div>
                <div class="stat-label">Platforms</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalCategories">-</div>
                <div class="stat-label">Categories</div>
            </div>
        </div>

        <!-- Search Section -->
        <div class="search-section">
            <h2>🔎 Content Search</h2>
            <form class="search-form" id="searchForm">
                <div class="search-input-group">
                    <input type="text" class="search-input" id="searchQuery" placeholder="Enter your search query..." required>
                    <button type="submit" class="search-btn">Search</button>
                </div>

                <div class="filters-section">
                    <div class="filter-group">
                        <label class="filter-label">Platform</label>
                        <select class="filter-select" id="platformFilter">
                            <option value="">All Platforms</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Category</label>
                        <select class="filter-select" id="categoryFilter">
                            <option value="">All Categories</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Author</label>
                        <input type="text" class="filter-input" id="authorFilter" placeholder="Author name...">
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Min Score</label>
                        <input type="number" class="filter-input" id="minScoreFilter" min="0" max="100" placeholder="0">
                    </div>
                </div>

                <div class="search-options">
                    <div class="checkbox-group">
                        <input type="checkbox" id="advancedSearch">
                        <label for="advancedSearch">Advanced Search</label>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Strategy</label>
                        <select class="strategy-select" id="searchStrategy">
                            <option value="combined">Combined</option>
                            <option value="keyword">Keyword</option>
                            <option value="semantic">Semantic</option>
                            <option value="category">Category</option>
                            <option value="author">Author</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Limit</label>
                        <select class="strategy-select" id="searchLimit">
                            <option value="10">10 results</option>
                            <option value="20" selected>20 results</option>
                            <option value="50">50 results</option>
                            <option value="100">100 results</option>
                        </select>
                    </div>
                </div>
            </form>
        </div>

        <!-- Research Section -->
        <div class="research-section">
            <h2>🧠 Topic Research</h2>
            <form class="research-form" id="researchForm">
                <input type="text" class="research-input" id="researchTopic" placeholder="Enter research topic..." required>
                
                <div class="research-options">
                    <div class="filter-group">
                        <label class="filter-label">Research Depth</label>
                        <select class="filter-select" id="researchDepth">
                            <option value="quick">Quick</option>
                            <option value="medium" selected>Medium</option>
                            <option value="deep">Deep</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label class="filter-label">Time Range (days)</label>
                        <input type="number" class="filter-input" id="timeRange" placeholder="30" min="1" max="365">
                    </div>
                </div>

                <button type="submit" class="research-btn">Start Research</button>
            </form>

            <div id="researchReport" class="research-report" style="display: none;">
                <h3>Research Report</h3>
                <div id="reportContent"></div>
            </div>
        </div>

        <!-- Results Section -->
        <div class="results-section">
            <div class="results-header">
                <h2>Results</h2>
                <div class="results-count" id="resultsCount">Ready to search</div>
            </div>
            
            <div id="loadingIndicator" class="loading" style="display: none;">
                <div class="spinner"></div>
                <p>Searching...</p>
            </div>

            <div id="errorMessage" class="error-message" style="display: none;"></div>

            <div id="resultsContainer">
                <div class="no-results">
                    <p>Enter a search query above to find relevant content</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // API Configuration
        const API_BASE = 'http://localhost:5001/api/v1/universal';
        
        // DOM Elements
        const searchForm = document.getElementById('searchForm');
        const researchForm = document.getElementById('researchForm');
        const searchQuery = document.getElementById('searchQuery');
        const researchTopic = document.getElementById('researchTopic');
        const resultsContainer = document.getElementById('resultsContainer');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const errorMessage = document.getElementById('errorMessage');
        const resultsCount = document.getElementById('resultsCount');
        const researchReport = document.getElementById('researchReport');
        const reportContent = document.getElementById('reportContent');

        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', function() {
            loadStats();
            loadFilters();
        });

        // Load statistics
        async function loadStats() {
            try {
                const response = await fetch(`${API_BASE}/stats`);
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('totalPosts').textContent = data.stats.total_posts;
                    document.getElementById('totalPlatforms').textContent = Object.keys(data.stats.platforms).length;
                    document.getElementById('totalCategories').textContent = Object.keys(data.stats.categories).length;
                }
            } catch (error) {
                console.error('Failed to load stats:', error);
            }
        }

        // Load filter options
        async function loadFilters() {
            try {
                const response = await fetch(`${API_BASE}/filters`);
                const data = await response.json();
                
                if (data.success) {
                    const platformSelect = document.getElementById('platformFilter');
                    const categorySelect = document.getElementById('categoryFilter');
                    
                    // Populate platforms
                    data.filters.platforms.forEach(platform => {
                        const option = document.createElement('option');
                        option.value = platform;
                        option.textContent = platform;
                        platformSelect.appendChild(option);
                    });
                    
                    // Populate categories
                    data.filters.categories.forEach(category => {
                        const option = document.createElement('option');
                        option.value = category;
                        option.textContent = category;
                        categorySelect.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Failed to load filters:', error);
            }
        }

        // Search form handler
        searchForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            await performSearch();
        });

        // Research form handler
        researchForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            await performResearch();
        });

        // Perform search
        async function performSearch() {
            const query = searchQuery.value.trim();
            if (!query) return;

            showLoading();
            hideError();

            try {
                const searchData = {
                    query: query,
                    strategy: document.getElementById('searchStrategy').value,
                    limit: parseInt(document.getElementById('searchLimit').value),
                    advanced: document.getElementById('advancedSearch').checked
                };

                // Add filters
                const platform = document.getElementById('platformFilter').value;
                const category = document.getElementById('categoryFilter').value;
                const author = document.getElementById('authorFilter').value;
                const minScore = document.getElementById('minScoreFilter').value;

                if (platform || category || author || minScore) {
                    searchData.filters = {};
                    if (platform) searchData.filters.platforms = [platform];
                    if (category) searchData.filters.categories = [category];
                    if (author) searchData.filters.authors = [author];
                    if (minScore) searchData.filters.min_value_score = parseInt(minScore);
                }

                const response = await fetch(`${API_BASE}/search`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(searchData)
                });

                const data = await response.json();

                if (data.success) {
                    displayResults(data.results, data.query);
                    resultsCount.textContent = `Found ${data.total_results} results for "${data.query}"`;
                } else {
                    showError(data.error || 'Search failed');
                }
            } catch (error) {
                console.error('Search error:', error);
                showError('Failed to perform search. Please try again.');
            } finally {
                hideLoading();
            }
        }

        // Perform research
        async function performResearch() {
            const topic = researchTopic.value.trim();
            if (!topic) return;

            showLoading();
            hideError();

            try {
                const researchData = {
                    topic: topic,
                    depth: document.getElementById('researchDepth').value
                };

                const timeRange = document.getElementById('timeRange').value;
                if (timeRange) {
                    researchData.time_range_days = parseInt(timeRange);
                }

                const response = await fetch(`${API_BASE}/research`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(researchData)
                });

                const data = await response.json();

                if (data.success) {
                    displayResearchReport(data.report);
                } else {
                    showError(data.error || 'Research failed');
                }
            } catch (error) {
                console.error('Research error:', error);
                showError('Failed to perform research. Please try again.');
            } finally {
                hideLoading();
            }
        }

        // Display search results
        function displayResults(results, query) {
            if (!results || results.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="no-results">
                        <p>No results found for "${query}"</p>
                        <p>Try adjusting your search terms or filters</p>
                    </div>
                `;
                return;
            }

            const resultsHTML = results.map(result => `
                <div class="result-item">
                    <div class="result-header">
                        <div>
                            <div class="result-title">${escapeHtml(result.title || 'Untitled')}</div>
                            <div class="result-meta">
                                <span class="result-platform">${escapeHtml(result.platform || 'Unknown')}</span>
                                ${result.value_score ? `<span class="result-score">Score: ${result.value_score}</span>` : ''}
                                <span>By ${escapeHtml(result.author || 'Unknown')}</span>
                                <span>${formatDate(result.created_at)}</span>
                            </div>
                        </div>
                    </div>
                    <div class="result-content">
                        ${escapeHtml(result.content || 'No content available')}
                    </div>
                    ${result.tags && result.tags.length > 0 ? `
                        <div class="result-tags">
                            ${result.tags.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`).join('')}
                        </div>
                    ` : ''}
                </div>
            `).join('');

            resultsContainer.innerHTML = resultsHTML;
        }

        // Display research report
        function displayResearchReport(report) {
            if (!report) {
                showError('No research report generated');
                return;
            }

            let reportHTML = '';
            
            if (typeof report === 'string') {
                reportHTML = `<p>${escapeHtml(report)}</p>`;
            } else if (typeof report === 'object') {
                reportHTML = `<pre>${JSON.stringify(report, null, 2)}</pre>`;
            }

            reportContent.innerHTML = reportHTML;
            researchReport.style.display = 'block';
        }

        // Utility functions
        function showLoading() {
            loadingIndicator.style.display = 'block';
            resultsContainer.style.display = 'none';
        }

        function hideLoading() {
            loadingIndicator.style.display = 'none';
            resultsContainer.style.display = 'block';
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
        }

        function hideError() {
            errorMessage.style.display = 'none';
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateString) {
            if (!dateString) return 'Unknown date';
            try {
                const date = new Date(dateString);
                return date.toLocaleDateString();
            } catch {
                return 'Invalid date';
            }
        }
    </script>
</body>
</html>
