# QA Agent Configuration
# Configuration file for the QA Agent

qa_checks:
  tests:
    enabled: true
    timeout: 300
    coverage_target: 70

  linting:
    enabled: true
    tool: "ruff"
    strict: false

  type_checking:
    enabled: true
    tool: "mypy"
    strict: false

  security:
    enabled: true
    tool: "bandit"
    severity_threshold: "HIGH"

  integration:
    enabled: true
    check_critical_paths: true

  documentation:
    enabled: true
    coverage_target: 80

reporting:
  format: "json"
  output_file: ".qa_report.json"
  include_details: true

